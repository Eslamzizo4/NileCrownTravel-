<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Nile Crown Travel | تفاصيل الرحلة</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="nav">

  <a class="brand" href="index.html">
    <span class="crown">♛</span>

    <span>
      Nile Crown
      <small>TRAVEL</small>
    </span>
  </a>

  <nav>
    <a id="navHome" href="index.html">الرئيسية</a>
    <a id="navTrips" href="trips.html">الرحلات</a>
    <a id="navContact" href="index.html#contact">تواصل</a>
  </nav>

  <a id="langButton" class="lang" href="en.html">EN</a>

</header>


<section class="trip-detail">

  <div id="tripPic" class="detail-pic"></div>


  <div class="detail-copy">

    <p id="category" class="eyebrow"></p>

    <h1 id="title"></h1>

    <p id="description"></p>


    <div class="price">

      <span id="priceLabel">السعر:</span>

      <span id="price">
        جاري تحميل السعر...
      </span>

    </div>


    <h3 id="includesTitle">
      يشمل البرنامج
    </h3>


    <ul>

      <li id="include1">
        تنظيم وتنسيق الرحلة
      </li>

      <li id="include2">
        التفاصيل حسب البرنامج المختار
      </li>

      <li id="include3">
        دعم وتواصل للحجز والاستفسار
      </li>

    </ul>


    <a
      id="book"
      class="btn"
      target="_blank"
      href="#">

      طلب حجز عبر واتساب

    </a>


    <a
      id="back"
      class="btn ghost dark"
      href="trips.html">

      العودة للرحلات

    </a>

  </div>

</section>


<script src="trip.js"></script>

</body>
</html>
