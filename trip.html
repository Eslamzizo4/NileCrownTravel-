<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>Nile Crown Travel | Trip Details</title>

  <link
    rel="stylesheet"
    href="style.css?v=2">

  <style>

    /* =========================
       LOGO
    ========================= */

    .brand{
      display:flex;
      align-items:center;
      text-decoration:none;
    }

    .brand-logo{
      width:72px;
      height:72px;
      object-fit:contain;
      display:block;
    }

    @media(max-width:600px){

      .brand-logo{
        width:58px;
        height:58px;
      }

    }

  </style>

</head>


<body>

<header class="nav">

  <!-- LOGO -->

  <a
    id="brandLink"
    class="brand"
    href="index.html">

    <img
      src="logo.png"
      alt="Nile Crown Travel"
      class="brand-logo">

  </a>


  <!-- DESKTOP MENU -->

  <nav>

    <a
      id="navHome"
      href="index.html">

      الرئيسية

    </a>


    <a
      id="navTrips"
      href="trips.html">

      الرحلات

    </a>


    <a
      id="navContact"
      href="index.html#contact">

      تواصل

    </a>

  </nav>


  <!-- MOBILE MENU BUTTON -->

  <button
    class="menu-btn"
    id="menuBtn"
    type="button"
    aria-label="فتح القائمة">

    ☰

  </button>


  <!-- LANGUAGE -->

  <a
    id="langButton"
    class="lang"
    href="#">

    EN

  </a>


  <!-- MOBILE MENU -->

  <div
    class="mobile-menu"
    id="mobileMenu">

    <a
      id="mobileHome"
      href="index.html">

      الرئيسية

    </a>


    <a
      id="mobileTrips"
      href="trips.html">

      الرحلات

    </a>


    <a
      id="mobileContact"
      href="index.html#contact">

      تواصل

    </a>

  </div>

</header>


<!-- =========================
     TRIP DETAILS
========================= -->

<section class="trip-detail">


  <!-- IMAGE -->

  <div
    id="tripPic"
    class="detail-pic">
  </div>


  <!-- DETAILS -->

  <div class="detail-copy">


    <p
      id="category"
      class="eyebrow">
    </p>


    <h1 id="title">
      جاري تحميل الرحلة...
    </h1>


    <p id="description">
      جاري تحميل تفاصيل الرحلة...
    </p>


    <!-- PRICE -->

    <div class="price">

      <span id="priceLabel">
        السعر:
      </span>


      <span id="price">
        جاري تحميل السعر...
      </span>

    </div>


    <!-- INCLUDED -->

    <h3 id="includesTitle">
      يشمل البرنامج
    </h3>


    <ul>

      <li id="include1">
        تنظيم وتنسيق الرحلة
      </li>


      <li id="include2">
        التفاصيل حسب البرنامج المختار
      </li>


      <li id="include3">
        دعم وتواصل للحجز والاستفسار
      </li>

    </ul>


    <!-- BOOK -->

    <a
      id="book"
      class="btn"
      target="_blank"
      rel="noopener"
      href="#">

      طلب حجز عبر واتساب

    </a>


    <!-- BACK -->

    <a
      id="back"
      class="btn ghost dark"
      href="trips.html">

      العودة للرحلات

    </a>

  </div>

</section>


<!-- =================================================
     LANGUAGE SYSTEM
================================================= -->

<script>

(function () {

  const params =
    new URLSearchParams(
      window.location.search
    );


  // =========================
  // تحديد اللغة
  // =========================

  const lang =
    params.get("lang") === "en"
      ? "en"
      : "ar";


  const isEnglish =
    lang === "en";


  const id =
    params.get("id") || "";


  // =========================
  // لغة واتجاه الصفحة
  // =========================

  document.documentElement.lang =
    lang;

  document.documentElement.dir =
    isEnglish
      ? "ltr"
      : "rtl";


  // =========================
  // العناصر
  // =========================

  const navHome =
    document.getElementById("navHome");

  const navTrips =
    document.getElementById("navTrips");

  const navContact =
    document.getElementById("navContact");


  const mobileHome =
    document.getElementById("mobileHome");

  const mobileTrips =
    document.getElementById("mobileTrips");

  const mobileContact =
    document.getElementById("mobileContact");


  const priceLabel =
    document.getElementById("priceLabel");

  const includesTitle =
    document.getElementById("includesTitle");


  const include1 =
    document.getElementById("include1");

  const include2 =
    document.getElementById("include2");

  const include3 =
    document.getElementById("include3");


  const book =
    document.getElementById("book");

  const back =
    document.getElementById("back");

  const langButton =
    document.getElementById("langButton");

  const brandLink =
    document.getElementById("brandLink");


  // =========================
  // ENGLISH
  // =========================

  if (isEnglish) {

    document.title =
      "Nile Crown Travel | Trip Details";


    // Desktop

    navHome.textContent =
      "Home";

    navTrips.textContent =
      "Trips";

    navContact.textContent =
      "Contact";


    // Mobile

    mobileHome.textContent =
      "Home";

    mobileTrips.textContent =
      "Trips";

    mobileContact.textContent =
      "Contact";


    // Content

    priceLabel.textContent =
      "Price:";


    includesTitle.textContent =
      "What's included";


    include1.textContent =
      "Trip organization and coordination";


    include2.textContent =
      "Details according to the selected program";


    include3.textContent =
      "Booking and inquiry support";


    book.textContent =
      "Book via WhatsApp";


    back.textContent =
      "Back to trips";


    // Language button

    langButton.textContent =
      "AR";


    langButton.href =
      "trip.html?id=" +
      encodeURIComponent(id) +
      "&lang=ar";


    // Desktop links

    brandLink.href =
      "en.html";


    navHome.href =
      "en.html";


    navTrips.href =
      "trips.html?lang=en";


    navContact.href =
      "en.html#contact";


    // Mobile links

    mobileHome.href =
      "en.html";


    mobileTrips.href =
      "trips.html?lang=en";


    mobileContact.href =
      "en.html#contact";


    // Back

    back.href =
      "trips.html?lang=en";

  }


  // =========================
  // ARABIC
  // =========================

  else {

    document.title =
      "تفاصيل الرحلة | Nile Crown Travel";


    // Desktop

    navHome.textContent =
      "الرئيسية";


    navTrips.textContent =
      "الرحلات";


    navContact.textContent =
      "تواصل";


    // Mobile

    mobileHome.textContent =
      "الرئيسية";


    mobileTrips.textContent =
      "الرحلات";


    mobileContact.textContent =
      "تواصل";


    // Content

    priceLabel.textContent =
      "السعر:";


    includesTitle.textContent =
      "يشمل البرنامج";


    include1.textContent =
      "تنظيم وتنسيق الرحلة";


    include2.textContent =
      "التفاصيل حسب البرنامج المختار";


    include3.textContent =
      "دعم وتواصل للحجز والاستفسار";


    book.textContent =
      "طلب حجز عبر واتساب";


    back.textContent =
      "العودة للرحلات";


    // Language button

    langButton.textContent =
      "EN";


    langButton.href =
      "trip.html?id=" +
      encodeURIComponent(id) +
      "&lang=en";


    // Desktop links

    brandLink.href =
      "index.html";


    navHome.href =
      "index.html";


    navTrips.href =
      "trips.html";


    navContact.href =
      "index.html#contact";


    // Mobile links

    mobileHome.href =
      "index.html";


    mobileTrips.href =
      "trips.html";


    mobileContact.href =
      "index.html#contact";


    // Back

    back.href =
      "trips.html";

  }

})();

</script>


<!-- =========================
     TRIP JS
========================= -->

<script src="trip.js"></script>


<!-- =========================
     MOBILE MENU
========================= -->

<script>

const menuBtn =
  document.getElementById("menuBtn");


const mobileMenu =
  document.getElementById("mobileMenu");


menuBtn.addEventListener(
  "click",
  function () {

    mobileMenu.classList.toggle("open");

  }
);


mobileMenu
  .querySelectorAll("a")
  .forEach(function (link) {

    link.addEventListener(
      "click",
      function () {

        mobileMenu.classList.remove("open");

      }
    );

  });

</script>


</body>
</html>
