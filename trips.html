<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Nile Crown Travel | الرحلات</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="nav">

  <a id="brandLink" class="brand" href="index.html">
    <span class="crown">♛</span>

    <span>
      Nile Crown
      <small>TRAVEL</small>
    </span>
  </a>


  <nav>

    <a id="navHome" href="index.html">
      الرئيسية
    </a>

    <a id="navTrips" href="trips.html">
      الرحلات
    </a>

    <a id="navAbout" href="index.html#about">
      عن الشركة
    </a>

    <a id="navContact" href="index.html#contact">
      تواصل
    </a>

  </nav>


  <a id="langButton" class="lang" href="trips.html?lang=en">
    EN
  </a>

</header>


<!-- =========================
     عنوان الصفحة
     ========================= -->

<section class="page-head">

  <p id="pageEyebrow" class="eyebrow">
    رحلات داخل مصر
  </p>

  <h1 id="pageTitle">
    كل الرحلات داخل مصر
  </h1>

  <p id="pageDescription">
    اختار وجهتك واضغط على الرحلة لمعرفة التفاصيل وطلب الحجز.
  </p>

</section>


<!-- =========================
     الرحلات
     ========================= -->

<section class="section">

  <div class="cards" id="tripsContainer">

    <p id="loadingText">
      جاري تحميل الرحلات...
    </p>

  </div>

</section>


<!-- =========================
     Footer
     ========================= -->

<footer>

  <b>Nile Crown Travel</b>

  <span id="footerText">
    رحلات داخل مصر
  </span>

</footer>


<!-- =========================
     لغة الصفحة
     ========================= -->

<script>

(function () {

  const params =
    new URLSearchParams(window.location.search);


  // =========================
  // تحديد اللغة
  // =========================

  const lang =
    params.get("lang") === "en"
      ? "en"
      : "ar";


  const isEnglish =
    lang === "en";


  // =========================
  // لغة واتجاه الصفحة
  // =========================

  document.documentElement.lang =
    isEnglish ? "en" : "ar";

  document.documentElement.dir =
    isEnglish ? "ltr" : "rtl";


  // =========================
  // اللغة الإنجليزية
  // =========================

  if (isEnglish) {

    document.title =
      "Nile Crown Travel | Trips";


    // Navigation

    document.getElementById("navHome").textContent =
      "Home";

    document.getElementById("navTrips").textContent =
      "Trips";

    document.getElementById("navAbout").textContent =
      "About Us";

    document.getElementById("navContact").textContent =
      "Contact";


    // Page Head

    document.getElementById("pageEyebrow").textContent =
      "TRIPS INSIDE EGYPT";

    document.getElementById("pageTitle").textContent =
      "All Trips Inside Egypt";

    document.getElementById("pageDescription").textContent =
      "Choose your destination and click on a trip to view details and request a booking.";


    // Footer

    document.getElementById("footerText").textContent =
      "Trips inside Egypt";


    // Language Button

    document.getElementById("langButton").textContent =
      "AR";


    // =========================
    // English Links
    // =========================

    document.getElementById("brandLink").href =
      "en.html";

    document.getElementById("navHome").href =
      "en.html";

    document.getElementById("navTrips").href =
      "trips.html?lang=en";

    document.getElementById("navAbout").href =
      "en.html#about";

    document.getElementById("navContact").href =
      "en.html#contact";


    // الرجوع للعربي

    document.getElementById("langButton").href =
      "trips.html";

  }


  // =========================
  // اللغة العربية
  // =========================

  else {

    document.title =
      "الرحلات | Nile Crown Travel";


    // Navigation

    document.getElementById("navHome").textContent =
      "الرئيسية";

    document.getElementById("navTrips").textContent =
      "الرحلات";

    document.getElementById("navAbout").textContent =
      "عن الشركة";

    document.getElementById("navContact").textContent =
      "تواصل";


    // Page Head

    document.getElementById("pageEyebrow").textContent =
      "رحلات داخل مصر";

    document.getElementById("pageTitle").textContent =
      "كل الرحلات داخل مصر";

    document.getElementById("pageDescription").textContent =
      "اختار وجهتك واضغط على الرحلة لمعرفة التفاصيل وطلب الحجز.";


    // Footer

    document.getElementById("footerText").textContent =
      "رحلات داخل مصر";


    // Language Button

    document.getElementById("langButton").textContent =
      "EN";


    // =========================
    // Arabic Links
    // =========================

    document.getElementById("brandLink").href =
      "index.html";

    document.getElementById("navHome").href =
      "index.html";

    document.getElementById("navTrips").href =
      "trips.html";

    document.getElementById("navAbout").href =
      "index.html#about";

    document.getElementById("navContact").href =
      "index.html#contact";


    // الذهاب للإنجليزي

    document.getElementById("langButton").href =
      "trips.html?lang=en";

  }

})();

</script>


<!-- =========================
     تحميل الرحلات من Supabase
     ========================= -->

<script src="trips.js"></script>


</body>
</html>
